<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hockey Slim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(#7dd3fc,#bae6fd 35%,#dcfce7);color:#1e293b;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#home,#parent{align-items:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.logo{text-align:center;margin:6px 0 14px}
.logo h1{margin:0;font-size:clamp(40px,9vw,64px);line-height:1;font-weight:800;color:#fff;text-shadow:0 4px 0 #1d4ed8,0 8px 18px rgba(0,0,0,.2)}
.logo p{margin:6px 0 0;font-size:clamp(18px,4vw,22px);font-weight:700;color:#1e3a8a}
.bounce{display:inline-block;animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) rotate(20deg)}}
.panel{width:100%;max-width:560px;background:rgba(255,255,255,.85);border-radius:26px;padding:16px;text-align:center;margin-bottom:14px}
.start{border:none;border-radius:30px;background:#22c55e;color:#fff;font-size:clamp(28px,7vw,40px);font-weight:800;padding:16px 40px;box-shadow:0 8px 0 #15803d;width:100%}
.start:active{transform:translateY(4px);box-shadow:0 4px 0 #15803d}
.donemsg{font-size:clamp(24px,6vw,32px);font-weight:800}
.sub{font-size:19px;font-weight:700;color:#334155;margin-top:6px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{background:#fff;border-radius:18px;padding:6px 14px;font-size:20px;font-weight:800;box-shadow:0 3px 0 #cbd5e1}
.divs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.divs div{background:#fff;border-radius:14px;padding:6px 10px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;white-space:nowrap}
.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:30px}
.linkbtn{border:2px solid #94a3b8;background:#fff;border-radius:14px;padding:6px 16px;font-weight:800;font-size:17px;margin:4px}
.loading{font-size:19px;font-weight:700;color:#1e3a8a;min-height:28px;text-align:center}
#parent .panel{text-align:left;font-size:17px;line-height:1.35}
#parent h2{margin:0 0 6px;font-size:22px}
#parent table{border-collapse:collapse;width:100%;font-size:16px}
#parent th,#parent td{padding:4px 8px;border-bottom:1px solid #cbd5e1;text-align:left;white-space:nowrap}
.tally{display:flex;gap:10px;margin:8px 0}
.tally button{flex:1;border:none;border-radius:18px;background:#e0f2fe;font-size:18px;font-weight:800;padding:12px 6px;box-shadow:0 4px 0 #94a3b8}
.tally b{display:block;font-size:34px}
.gate button{border:none;border-radius:16px;background:#fff;font-size:26px;font-weight:800;padding:8px 20px;margin:6px;box-shadow:0 4px 0 #94a3b8}

#game{background:#a9d3ef}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cover{position:absolute;inset:0;z-index:2;background:#2f7d3a;display:none;align-items:center;justify-content:center;font-size:120px;padding-bottom:140px}
#cover.on{display:flex}
.top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 18px;background:linear-gradient(rgba(15,23,42,.45),rgba(15,23,42,0));pointer-events:none}
.top>*{pointer-events:auto}
.iconbtn{flex:none;width:50px;height:50px;border-radius:16px;border:none;background:#fff;font-size:24px;box-shadow:0 4px 0 #94a3b8;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #94a3b8}
.iconbtn.act{background:#bbf7d0}
.mid{flex:1;min-width:0}
.wtitle{font-weight:800;font-size:clamp(17px,4.2vw,24px);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess{height:10px;background:rgba(255,255,255,.4);border-radius:99px;overflow:hidden;margin-top:2px}
.sess i{display:block;height:100%;width:0;background:#facc15}
.turn{position:absolute;top:40%;z-index:3;width:66px;height:66px;border-radius:50%;border:none;background:rgba(255,255,255,.8);font-size:28px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2);touch-action:none}
.turn.l{left:10px}.turn.r{right:10px}
.turn:active{background:#fde047}
.ballind{position:absolute;top:29%;z-index:3;background:#fff;border-radius:99px;padding:2px 14px;font-size:24px;font-weight:800;display:none;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:blink 1s infinite;pointer-events:none}
.ballind.l{left:84px}.ballind.r{right:84px}
.ballind.on{display:block}
@keyframes blink{50%{opacity:.55}}
.pill{position:absolute;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.92);border-radius:99px;padding:4px 16px;font-size:18px;font-weight:800;white-space:nowrap;display:none;pointer-events:none}
.pill.on{display:block}
.hasball{position:absolute;left:50%;bottom:calc(var(--bot,190px) + 8px);transform:translateX(-50%);z-index:3;background:#1d4ed8;color:#fff;border-radius:99px;padding:3px 16px;font-size:18px;font-weight:800;white-space:nowrap;display:none;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hasball.on{display:block}
.bannerTxt{position:absolute;left:0;right:0;top:28%;z-index:4;text-align:center;font-size:clamp(50px,13vw,90px);font-weight:800;color:#facc15;-webkit-text-stroke:4px #7c2d12;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.25);display:none;pointer-events:none}
.bannerTxt.on{display:block;animation:pop .45s}
.face{position:absolute;left:50%;top:44%;z-index:4;font-size:90px;transform:translate(-50%,-50%) scale(0);pointer-events:none;transition:transform .25s}
.face.show{transform:translate(-50%,-50%) scale(1)}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:stretch;pointer-events:none}
.bottom>*{pointer-events:auto}
.ansbar{height:12px;margin:0 16px 2px;background:rgba(255,255,255,.5);border-radius:99px;overflow:hidden;visibility:hidden}
.ansbar.on{visibility:visible}
.ansbar i{display:block;height:100%;width:100%;background:#f97316;transform-origin:left}
.bubble{margin:4px 12px;background:rgba(255,255,255,.95);border-radius:22px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:clamp(17px,3.8vw,21px);line-height:1.25;min-height:60px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bubble .iconbtn{width:46px;height:46px;box-shadow:0 3px 0 #94a3b8;background:#e0f2fe}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:6px 10px calc(12px + env(safe-area-inset-bottom));min-height:84px;flex-wrap:wrap}
.choice{width:clamp(84px,22vw,120px);height:clamp(84px,22vw,112px);border-radius:24px;border:none;background:#fff;box-shadow:0 6px 0 #64748b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(14px,3.4vw,18px);gap:2px}
.choice svg{width:56%;height:56%}
.choice .big{font-size:clamp(34px,9vw,48px);line-height:1}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #64748b}
.choice.glow{box-shadow:0 0 0 6px #4ade80,0 6px 0 #64748b}
.choice.bad{box-shadow:0 0 0 6px #f87171,0 6px 0 #64748b}
.next{border:none;border-radius:26px;background:#22c55e;color:#fff;font-size:clamp(22px,5.5vw,30px);font-weight:800;padding:10px 30px;box-shadow:0 7px 0 #15803d;animation:pop .35s}
.next:active{transform:translateY(4px);box-shadow:0 3px 0 #15803d}
.tip{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:18px;padding:4px 14px}
.tip .hand{font-size:30px;animation:bounce 1.2s infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media (max-height:520px){
 .bubble{font-size:15px;min-height:0;padding:4px 10px;margin:2px 10px}
 .bubble .iconbtn{width:38px;height:38px;font-size:20px}
 .controls{min-height:0;padding:4px 10px calc(6px + env(safe-area-inset-bottom))}
 .choice{width:80px;height:70px;font-size:13px;border-radius:18px}
 .iconbtn{width:42px;height:42px;font-size:20px}
 .turn{width:54px;height:54px;top:34%}
 .pill{top:calc(56px + env(safe-area-inset-top));font-size:15px}
 #cover{padding-bottom:110px;font-size:80px}
}
#done{position:absolute;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:6;overflow-y:auto}
#done.on{display:flex}
.card{background:#fff;border-radius:30px;padding:20px 18px;max-width:460px;width:100%;text-align:center;animation:pop .4s}
.card .trophy{font-size:72px;line-height:1}
.card h2{margin:2px 0 8px;font-size:28px}
.card table{width:100%;border-collapse:collapse;font-size:19px;font-weight:700;margin-bottom:8px}
.card td{padding:4px 6px;border-bottom:1px solid #e2e8f0;white-space:nowrap;text-align:left}
.card td:last-child,.card td:nth-child(2){text-align:right}
.card p{font-size:19px;line-height:1.3;margin:6px 0}
.promo{background:#fef9c3;border-radius:14px;padding:6px;font-weight:800}
.confetti{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;z-index:7;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="logo"><h1>Hockey Slim <span class="bounce">🏑</span></h1><p>Elke dag even trainen</p></div>
  <div class="panel" id="todayBox"></div>
  <div class="loading" id="loading"></div>
  <div class="panel"><div class="chips" id="chips"></div></div>
  <div class="panel"><div class="divs" id="divs"></div></div>
  <div class="panel"><div class="cards" id="cards"></div></div>
  <button class="linkbtn" id="parentBtn">Voor ouders</button>
</section>

<section id="parent" class="screen">
  <div class="logo"><h1 style="font-size:40px">Voor ouders</h1></div>
  <div id="parentBody" style="width:100%;max-width:560px"></div>
  <button class="linkbtn" id="parentBack">Terug</button>
</section>

<section id="game" class="screen">
  <canvas id="c"></canvas>
  <div id="cover">🙈</div>
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="Stoppen">🏠</button>
    <div class="mid"><div class="wtitle" id="wtitle"></div><div class="sess"><i id="sessBar"></i></div></div>
    <button class="iconbtn" id="gyroBtn" aria-label="Kijken door te bewegen">📱</button>
    <button class="iconbtn" id="muteBtn" aria-label="Geluid aan of uit">🔊</button>
  </div>
  <div class="pill" id="lookTip"></div>
  <button class="turn l" id="turnL" aria-label="Kijk naar links">◀</button>
  <button class="turn r" id="turnR" aria-label="Kijk naar rechts">▶</button>
  <div class="ballind l" id="ballL">◀ ⚪</div>
  <div class="ballind r" id="ballR">⚪ ▶</div>
  <div class="hasball" id="hasBall">🏑 Jij hebt de bal</div>
  <div class="bannerTxt" id="bannerTxt"></div>
  <div class="face" id="face"></div>
  <div class="bottom">
    <div class="ansbar" id="ansbar"><i id="ansFill"></i></div>
    <div class="bubble"><button class="iconbtn" id="sayBtn" aria-label="Nog een keer voorlezen">🗣️</button><div id="sayText"></div></div>
    <div class="controls" id="controls"></div>
  </div>
  <div id="done"><div class="card" id="doneCard"></div></div>
</section>

<script type="module">
const THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let T=null;
const $=s=>document.querySelector(s);
const SX=0.0717,SY=0.0625,S=0.067, EYE=1.2, R=0.06;
const AREA=460, OWNAREA=140; // 10-metergebied: 10 m vanaf elke achterlijn
const OWN={x:0,y:200}, GOAL={x:600,y:200};
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function dSeg(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l2=vx*vx+vy*vy;let t=l2?((p.x-a.x)*vx+(p.y-a.y)*vy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*vx),p.y-(a.y+t*vy));}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const lerpA=(a,b,t)=>a+wrapA(b-a)*t;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=(r,a,b)=>a+r()*(b-a);
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const inField=p=>p.x>=40&&p.x<=560&&p.y>=40&&p.y<=360;
function place(r,all,x0,x1,y0,y1,cond,minD){if(x1<x0+10)x1=x0+10;for(let i=0;i<60;i++){const p={x:rnd(r,x0,x1),y:rnd(r,y0,y1)};if(all.every(q=>d2(p,q)>=(minD||60))&&(!cond||cond(p)))return p;}return null;}

/* ================= instellingen ================= */
const CFG={warm:60,main:180,rev:60,testN:20};
const DIVS=[null,
 {nb:2,nr:1,look:0,ans:0,move:false},
 {nb:3,nr:2,look:0,ans:8,move:false},
 {nb:4,nr:4,look:5,ans:6,move:true},
 {nb:4,nr:4,look:3,ans:4,move:true,behind:true},
 {nb:5,nr:5,look:3,ans:3,move:true,behind:true},
 {nb:5,nr:5,look:2,ans:2,move:true,behind:true,feint:true}];
const MODES={scan:{name:'Kijk rond',emoji:'👀',min:1},choice:{name:'Kies snel',emoji:'🏑',min:1},pos:{name:'Sta goed',emoji:'📍',min:1},sw:{name:'Omschakelen',emoji:'🔄',min:1},predict:{name:'Wat gebeurt er?',emoji:'🔮',min:3}};
const CARDS=['🦊 Snelle Vos','🦁 Dappere Leeuw','🦅 Scherpe Arend','🐆 Felle Luipaard','🦉 Slimme Uil','🐺 Sterke Wolf','🐬 Vlugge Dolfijn','🦈 Stoere Haai','🐯 Taaie Tijger','🦄 Gouden Eenhoorn','🐻 Grote Beer','🦖 Wilde Dino','🐲 Vurige Draak','🦍 Krachtige Gorilla','🦓 Zebra Zes','🐘 Rots Olifant','🦏 Neushoorn Negen','🐊 Krokodil Keeper','🦘 Kangoeroe Kop','🐝 Bezige Bij'];
const WHY={
 close:'Te dichtbij! Ga iets verder weg staan, dan kan je maatje de bal goed geven.',
 far:'Dat is te ver weg. Blijf dichter bij je maatje.',
 out:'Dat is buiten het veld. Blijf binnen de witte lijnen.',
 blocked:'Er stond een rode speler tussen jou en de bal. Kijk naar de groene cirkel: daar zie je de bal helemaal.',
 marked:'Er stond een rode speler vlak naast je. Kijk naar de groene cirkel: daar sta je vrij.',
 back:'Je moest naar voren, naar het rode goal. Kijk naar de groene cirkel.',
 behind:'Je stond achter de bal. Ga tussen de bal en jullie blauwe goal staan, op de gele lijn.',
 offline:'Bijna! Ga op de gele lijn staan, tussen de bal en jullie blauwe goal.'
};
const ICON={
 pass:'<svg viewBox="0 0 64 64"><circle cx="12" cy="46" r="9" fill="#2563eb"/><circle cx="52" cy="18" r="9" fill="#2563eb"/><path d="M21 40 L40 27" stroke="#1e293b" stroke-width="4" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M34 23 L44 24 L40 33" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 dribble:'<svg viewBox="0 0 64 64"><circle cx="11" cy="32" r="9" fill="#2563eb"/><path d="M22 32 q5 -12 10 0 t10 0" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/><circle cx="53" cy="32" r="7" fill="#fff" stroke="#1e293b" stroke-width="3"/></svg>',
 shoot:'<svg viewBox="0 0 64 64"><path d="M34 12 H60 V52 H34" fill="none" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/><path d="M40 12 V52 M46 12 V52 M52 12 V52 M34 22 H60 M34 32 H60 M34 42 H60" stroke="#94a3b8" stroke-width="1.5"/><circle cx="46" cy="32" r="7" fill="#fff" stroke="#1e293b" stroke-width="3"/><path d="M4 26 H24 M8 34 H28 M4 42 H22" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/></svg>',
 forward:'<svg viewBox="0 0 64 64"><path d="M6 24 H34 V10 L60 32 L34 54 V40 H6 Z" fill="#22c55e" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/></svg>',
 back:'<svg viewBox="0 0 64 64"><path d="M58 24 H30 V10 L4 32 L30 54 V40 H58 Z" fill="#f97316" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/></svg>'
};
const LABEL={pass:'Passen',dribble:'Zelf gaan',shoot:'Schieten',forward:'Naar voren',back:'Snel terug',voor:'Voor',links:'Links',rechts:'Rechts',achter:'Achter'};
const ARROW={voor:'⬆️',links:'⬅️',rechts:'➡️',achter:'⬇️'};

/* ================= opslag ================= */
const KEY='hockeyslim-v1';
function fresh(){return{div:{scan:2,choice:2,pos:2,sw:2,predict:3},up:{},count:0,lastDay:'',dayStreak:0,cards:0,sessions:[],tests:[],review:[],tally:[],extra:false,seed:Math.floor(Math.random()*1e9)};}
let ST=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.div)ST=Object.assign(fresh(),s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const dayIdx=s=>Math.round(Date.parse(s+'T12:00:00')/864e5);
const nl=s=>{const p=s.split('-');return p[2]+'-'+p[1];};
const sec=v=>v==null?'':v.toFixed(1).replace('.',',')+' s';
function median(a){if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}

/* ================= stem en geluid ================= */
let muted=false,voice=null,ac=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^nl[-_]NL/i.test(v.lang))||vs.find(v=>/^nl/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(t){if(muted||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';if(voice)u.voice=voice;u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}return ac;}
function tone(f,t,dur,type,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);}
function noise(t,dur,freq,vol){const n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.7;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);}
function sfx(k){const a=audio();if(!a||muted)return;const t=a.currentTime;try{
 if(k==='good')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.08,.2,'triangle',.14));

function groundDash(a,b,color){
 const A=toW(a.x,a.y),B=toW(b.x,b.y),len=A.distanceTo(B),dir=B.clone().sub(A).normalize(),ang=Math.atan2(dir.x,dir.z);
 const mat=new T.MeshBasicMaterial({color,transparent:true,opacity:.95,depthWrite:false});
 for(let s=0;s<len;s+=1){const seg=Math.min(.6,len-s);const m=new T.Mesh(new T.PlaneGeometry(.18,seg),mat);m.rotation.order='YXZ';m.rotation.y=ang;m.rotation.x=-Math.PI/2;const c=A.clone().add(dir.clone().multiplyScalar(s+seg/2));m.position.set(c.x,.035,c.z);marks.add(m);}
}
function groundRing(f,color,r){const m=new T.Mesh(new T.RingGeometry((r||.9)-.16,r||.9,40),new T.MeshBasicMaterial({color,transparent:true,opacity:.9,depthWrite:false}));m.rotation.x=-Math.PI/2;const w=toW(f.x,f.y);m.position.set(w.x,.04,w.z);marks.add(m);pulsers.push(m);}
function hintSpot(f){groundRing(f,0x22c55e,1.1);const disc=new T.Mesh(new T.CircleGeometry(.95,40),new T.MeshBasicMaterial({color:0x4ade80,transparent:true,opacity:.35,depthWrite:false}));disc.rotation.x=-Math.PI/2;const w=toW(f.x,f.y);disc.position.set(w.x,.03,w.z);marks.add(disc);}

function waitAnswer(limit){return new Promise(res=>{cur.locked=false;cur.t0=performance.now();cur.res=res;if(limit){startBar(limit);cur.to=setTimeout(()=>{if(cur.res===res)finish({ok:false,late:true,rt:limit});},limit*1000);}});}
function freeze(){if(!cur.res||cur.locked)return null;cur.locked=true;clearTimeout(cur.to);stopBar();return (performance.now()-cur.t0)/1000;}
function finish(r){const f=cur.res;cur.res=null;cur.locked=true;clearTimeout(cur.to);stopBar();if(f)f(r);}

function pickScan(v){const rt=freeze();if(rt==null)return;const sc=cur.sc;const ok=v===sc.correct;markBtn(sc.correct,true);if(!ok)markBtn(v,false);finish({ok,rt});}
function pickTap(id){const rt=freeze();if(rt==null)return;finish({ok:id===cur.sc.correct,rt});}
function pickSwitch(dir){
 const sc=cur.sc;if(!cur.res||!cur.sw)return;
 if(cur.sw.phase==='pre'){finish({ok:false,rt:0,early:true});return;}
 const rt=(performance.now()-cur.t0)/1000;if(sc.correct!=='none')markBtn(sc.correct,true);if(dir!==sc.correct)markBtn(dir,false);finish({ok:dir===sc.correct,rt});

 lookMode='run';await runTo('me',clamp(x,20,580),clamp(y,20,380),6);if(my!==tok)return;

 const j=checkPos(sc.rule,PL.me.f,PL[sc.ball].f,sc.red.map(r=>PL[r.id].f),ballF());cur.res=cur.resKeep;finish({ok:j.ok,rt,j});

async function introMove(sc){
 const ps=[];for(const id in PL){if(id==='me'||PL[id].team==='gk')continue;const p=PL[id];const h=p.home;p.f.x=clamp(h.x+(Math.random()-.5)*110,25,575);p.f.y=clamp(h.y+(Math.random()-.5)*90,25,375);ps.push(runTo(id,h.x,h.y,3.2));}
 ball.position.copy(ballTargetFor(sc.ball));await Promise.all(ps);
}
async function runItem(sc,test){
 const my=++tok;const alive=()=>my===tok&&running3d;const P=DIVS[sc.div];
 anims.forEach(a=>a.res());anims=[];
 cur={sc,locked:true,scan:0,lockLook:false,phase:'look'};clearMarks();$('#cover').classList.remove('on');stopBar();
 spawn(sc);const c=$('#controls');c.innerHTML='';
 $('#wtitle').textContent=MODES[sc.mode].emoji+' '+MODES[sc.mode].name+(test?' · meetmoment':'');
 setSay(sc.say);
 if(sc.mode==='choice'&&!test&&ST.count<3)pill(gyro.on?'📱 Draai de tablet om rond te kijken':'👆 Veeg om rond te kijken','look');
 if(P.move&&sc.mode!=='sw'){await introMove(sc);if(!alive())return null;}
 let r;
 if(sc.mode==='scan'){
  if(P.look){startBar(P.look);await wait(P.look*1000);}
  else{await new Promise(res=>{const b=document.createElement('button');b.className='next';b.id='klaarBtn';b.textContent='Klaar met kijken';b.onclick=res;c.appendChild(b);setTimeout(res,12000);});}
  if(!alive())return null;stopBar();cur.lockLook=true;cur.phase='ask';$('#cover').classList.add('on');setSay(sc.ask);c.innerHTML='';
  sc.options.forEach(o=>c.appendChild(btn(sc.kind==='count'?'':LABEL[o],'<div class="big">'+(sc.kind==='count'?o:ARROW[o])+'</div>',pickScan,o)));
  await wait(500);if(!alive())return null;r=await waitAnswer(P.ans);
 }else if(sc.mode==='sw'){
  c.appendChild(btn(LABEL.back,ICON.back,pickSwitch,'back'));c.appendChild(btn(LABEL.forward,ICON.forward,pickSwitch,'forward'));
  cur.sw={phase:'pre'};const pr=new Promise(res=>{cur.res=res;});cur.locked=false;
  (async()=>{
   await wait(1500+sc.delay*1000);if(!alive()||!cur.res)return;
   const ch=PL[sc.chal],ow=PL[sc.ball];const hx=ch.f.x,hy=ch.f.y;
   await runTo(sc.chal,ow.f.x+(hx-ow.f.x)*.35,ow.f.y+(hy-ow.f.y)*.35,7);if(!alive()||!cur.res)return;
   if(!sc.feint){ballOwner=sc.chal;sfx('kick');}
   cur.sw.phase='go';cur.t0=performance.now();
   if(sc.feint)runTo(sc.chal,hx,hy,4);
   const lim=sc.feint?2:(P.ans||6);if(!sc.feint&&P.ans)startBar(lim);
   cur.to=setTimeout(()=>{if(alive()&&cur.res)finish({ok:sc.correct==='none',late:sc.correct!=='none',rt:sc.correct==='none'?null:lim});},lim*1000);
  })();
  r=await pr;
 }else{
  if(sc.mode==='choice')['pass','dribble','shoot'].forEach(o=>c.appendChild(btn(LABEL[o],ICON[o],pickChoice,o)));
  else c.innerHTML=tipHTML(sc.mode==='pos'?'Tik op het gras':'Tik op een rode speler');
  await wait(900);if(!alive())return null;
  const pr=waitAnswer(P.ans);cur.resKeep=cur.res;r=await pr;
 }
 if(!alive())return null;
 await feedback(sc,r,test,alive);
 return alive()?r:null;
}
async function feedback(sc,r,test,alive){
 $('#lookTip').classList.remove('on');
 if(test){sfx(r.ok?'tick':'bad');face(r.ok?'✅':'❌');await wait(650);$('#cover').classList.remove('on');cur.lockLook=false;return;}
 $('#cover').classList.remove('on');cur.lockLook=false;
 if(r.ok){
  sfx('good');face('😃');setSay('Goed zo! '+sc.good+(r.scanned?' En je keek goed om je heen!':''));
  lookMode='ball';
  if(sc.mode==='choice'){if(sc.correct==='shoot')await shoot();else if(sc.correct==='pass'){await pass('b1');banner('Pass!');}else{await runTo('me',sc.key.x,sc.key.y,4.5);banner('Ga!');}}
  else if(sc.mode==='pos'){if(sc.rule==='cover'){const c=PL[sc.ball].f,me=PL.me.f,dd=d2(c,me)||1,k=Math.max(0,(dd-28)/dd);await runTo(sc.ball,c.x+(me.x-c.x)*k,c.y+(me.y-c.y)*k,3.5);if(alive()){ballOwner='me';sfx('kick');banner('Hebbes!');}}else{await pass('me');banner('Vrij!');}}
  else if(sc.mode==='predict'){await pass(sc.correct);}
  else if(sc.mode==='sw'){banner(sc.correct==='back'?'Terug!':sc.correct==='forward'?'Vooruit!':'Rustig!');}
  await wait(1500);lookMode='free';return;
 }
 sfx('bad');face('🤔');
 let msg=sc.why;
 if(sc.mode==='pos')msg=r.late?'Tik sneller op het gras. Kijk naar de groene cirkel: daar kon je staan.':WHY[r.j.why];
 if(r.early)msg='Te vroeg! Wacht tot de bal van team wisselt.';else if(r.late&&sc.mode!=='pos')msg='Te laat! '+msg;
 setSay(msg);
 if(sc.mode==='pos'){if(sc.rule==='cover')groundDash(PL[sc.ball].f,OWN,0xfde047);else if(r.j&&r.j.by!=null){groundDash(ballF(),PL.me.f,0xef4444);groundRing(PL[sc.red[r.j.by].id].f,0xf97316,.8);}hintSpot(sc.hint);}
 else if(sc.mode==='choice')hintSpot(sc.key);
 else if(sc.mode==='scan'){if(sc.kind==='count')sc.red.forEach(p=>groundRing(p,0xf97316,.8));else hintSpot(sc.target);}
 else if(sc.mode==='predict'){hintSpot(PL[sc.correct].f);groundDash(PL.r1.f,PL[sc.correct].f,0xfde047);}
 await wait(500);if(!alive())return;
 if(sc.mode!=='sw'){await flyTo('over');if(!alive())return;}
 const c=$('#controls');c.innerHTML='';
 await new Promise(res=>{const b=document.createElement('button');b.className='next';b.id='verderBtn';b.textContent='Verder ▶';b.onclick=()=>{audio();res();};c.appendChild(b);setTimeout(res,15000);});
 if(!alive())return;c.innerHTML='';
 if(camMode==='over'){await flyTo('pov');}
}

let sess=null;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));running3d=(id==='game');}
async function ensure3D(){
 if(built)return true;$('#loading').textContent='Het veld wordt klaargezet...';
 try{T=await import(THREE_URL);build();$('#loading').textContent='';return true;}
 catch(e){$('#loading').textContent='Het 3D-veld kon niet laden. Controleer de internetverbinding en probeer het opnieuw.';console.error(e);return false;}
}
function nextSeed(){ST.seed=(ST.seed*1103515245+12345)&0x7fffffff;return ST.seed;}
function testDue(){if(ST.count<1)return false;if(!ST.tests.length)return true;return dayIdx(today())-dayIdx(ST.tests[ST.tests.length-1].d)>=7;}
function mainModes(){const av=['choice','pos','sw'];if(ST.div.choice>=3||ST.div.pos>=3)av.push('predict');const n=av.length,i=ST.count%n;return[av[i],av[(i+1)%n]];}
async function startSession(){
 if(!(await ensure3D()))return;audio();
 const isTest=testDue();show('game');resize();$('#done').classList.remove('on');sfx('whistle');
 const stats={scan:[],choice:[],pos:[],sw:[],predict:[]};const t0=performance.now();const total=isTest?1:(CFG.warm+CFG.main+CFG.rev)*1000;
 let done=0;const my={};sess={progress:()=>isTest?done/CFG.testN:(performance.now()-t0)/total,id:my};
 const alive=()=>sess&&sess.id===my;
 const run=async(mode,div,seed,test)=>{const sc=gen(mode,div,seed);if(!sc)return null;const r=await runItem(sc,test);if(r&&alive()){stats[sc.mode].push(r);done++;}return r;};
 if(isTest){
  const order=['scan','choice','pos','sw'];
  for(let i=0;i<CFG.testN&&alive();i++){const r=await run(order[i%4],2,nextSeed(),true);if(!r)break;}
  if(!alive())return;finishSession(stats,true);return;
 }
 const tDay=today();
 const phase=async(dur,modes)=>{const end=performance.now()+dur*1000;let i=0;while(performance.now()<end&&alive()){const m=modes[i++%modes.length];const seed=nextSeed();const r=await run(m,Math.max(ST.div[m],MODES[m].min),seed,false);if(!r)return false;if(!r.ok)ST.review.push({m,seed,v:Math.max(ST.div[m],MODES[m].min),due:dayIdx(tDay)+1,step:0});}return alive();};
 if(!(await phase(CFG.warm,['scan'])))return;
 const mm=mainModes();if(!(await phase(CFG.main,mm)))return;
 // herhaling: eerdere fouten die vandaag aan de beurt zijn
 const end=performance.now()+CFG.rev*1000;const dueNow=ST.review.filter(q=>q.due<=dayIdx(tDay));
 while(performance.now()<end&&alive()){
  const q=dueNow.shift();
  if(q){const r=await run(q.m,q.v,q.seed,false);if(!r)return;if(r.ok){q.step++;if(q.step>=3)ST.review=ST.review.filter(x=>x!==q);else q.due=dayIdx(tDay)+[1,3,7][q.step];}else{q.step=0;q.due=dayIdx(tDay)+1;}}
  else{const m=mm.concat('scan').sort((a,b)=>pct(stats[a])-pct(stats[b]))[0];const r=await run(m,Math.max(ST.div[m],MODES[m].min),nextSeed(),false);if(!r)return;}
 }
 if(!alive())return;if(ST.review.length>60)ST.review=ST.review.slice(-60);
 finishSession(stats,false);
}
function pct(rs){return rs.length?rs.filter(r=>r.ok).length/rs.length:1;}
function finishSession(stats,isTest){
 sess=null;tok++;cur={sc:null,locked:true,scan:0,lockLook:false};
 const d=today();const all=[].concat(...Object.values(stats));const okN=all.filter(r=>r.ok).length;
 const rts=all.filter(r=>r.ok&&r.rt>0).map(r=>r.rt);const med=median(rts);
 const rows=[],promos=[];
 for(const m in stats){const rs=stats[m];if(!rs.length)continue;const ok=rs.filter(r=>r.ok).length;rows.push('<tr><td>'+MODES[m].emoji+' '+MODES[m].name+'</td><td>'+ok+' van '+rs.length+'</td><td>'+sec(median(rs.filter(r=>r.ok&&r.rt>0).map(r=>r.rt)))+'</td></tr>');
  if(!isTest&&rs.length>=4){const p=ok/rs.length;if(p>=.8){ST.up[m]=(ST.up[m]||0)+1;if(ST.up[m]>=2&&ST.div[m]<6){ST.div[m]++;ST.up[m]=0;promos.push('Divisie '+ST.div[m]+' bij '+MODES[m].name+'!');}}else{ST.up[m]=0;if(p<.5&&ST.div[m]>MODES[m].min)ST.div[m]--;}}}
 const looked=stats.choice.filter(r=>r.scanned).length;
 const entry={d,n:all.length,ok:okN,rt:med,m:{}};for(const m in stats)if(stats[m].length)entry.m[m]=[stats[m].length,stats[m].filter(r=>r.ok).length];
 if(isTest)ST.tests.push({d,n:all.length,ok:okN,rt:med});else{ST.sessions.push(entry);if(ST.sessions.length>200)ST.sessions.shift();}
 if(ST.lastDay!==d){ST.dayStreak=(ST.lastDay&&dayIdx(d)-dayIdx(ST.lastDay)===1)?ST.dayStreak+1:1;ST.lastDay=d;ST.cards++;}
 ST.count++;ST.extra=false;save();
 const card=CARDS[(ST.cards-1)%CARDS.length];
 $('#doneCard').innerHTML='<div class="trophy">'+(isTest?'📏':'🏆')+'</div><h2>'+(isTest?'Meetmoment klaar!':'Training klaar!')+'</h2><table>'+rows.join('')+'</table>'
  +'<p>Goed: <b>'+okN+' van '+all.length+'</b>'+(med!=null?' · Snelheid: <b>'+sec(med)+'</b>':'')+'</p>'
  +(stats.choice.length&&!isTest?'<p>👀 Rondgekeken: '+looked+' van '+stats.choice.length+' keer</p>':'')
  +promos.map(p=>'<p class="promo">⬆️ '+p+'</p>').join('')
  +'<p>Nieuwe kaart: <b>'+card+'</b></p><p>🔥 '+ST.dayStreak+(ST.dayStreak===1?' dag':' dagen')+' op rij</p><button class="next" id="doneBtn">Tot morgen! 👋</button>';
 $('#doneBtn').onclick=goHome;$('#done').classList.add('on');sfx('goal');confetti();
 speak((isTest?'Meetmoment klaar! ':'Training klaar! ')+okN+' van de '+all.length+' goed. '+(promos.length?'En je gaat een divisie omhoog! ':'')+'Tot morgen!');
}

 $('#pExtra').onclick=()=>{ST.extra=true;save();$('#pMsg').textContent='Er kan vandaag nog één training worden gedaan.';};
 let armed=false;$('#pReset').onclick=()=>{if(!armed){armed=true;$('#pMsg').textContent='Tik nog een keer om echt alles te wissen.';return;}ST=fresh();save();renderParent(true);};

/* ================= invoer ================= */
function setupInput(){
 const cv=$('#c');let ptr=null;
 cv.addEventListener('pointerdown',e=>{if(!cur.sc)return;audio();ptr={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};try{cv.setPointerCapture(e.pointerId);}catch(_){} });
 cv.addEventListener('pointermove',e=>{
  if(!ptr)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.moved+=Math.abs(dx)+Math.abs(dy);ptr.x=e.clientX;ptr.y=e.clientY;
  if(ptr.moved>10&&camMode==='pov'&&lookMode==='free'&&!cur.lockLook){const vf=camera.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);const dyaw=dx*hf/cv.clientWidth;yaw+=dyaw;gyro.off+=dyaw;addScan(Math.abs(dyaw));if(!(gyro.on&&gyro.got))pitch=clamp(pitch+dy*vf/cv.clientHeight,-.75,.3);}
 });
 cv.addEventListener('pointerup',e=>{if(!ptr)return;const tap=ptr.moved<12&&performance.now()-ptr.t<650;ptr=null;if(tap)onTap(e.clientX,e.clientY);});
 cv.addEventListener('pointercancel',()=>{ptr=null;});
 const hold=(el,dir)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();audio();turning=dir;});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{if(turning===dir)turning=0;}));};
 hold($('#turnL'),1);hold($('#turnR'),-1);
}
function onTap(cx,cy){
 const sc=cur.sc;if(!sc||cur.locked||camMode!=='pov'||!cur.res)return;
 const cv=$('#c'),rect=cv.getBoundingClientRect();
 raycaster.setFromCamera(new T.Vector2(((cx-rect.left)/rect.width)*2-1,-((cy-rect.top)/rect.height)*2+1),camera);
 if(sc.mode==='predict'){const ids=sc.red.map(r=>r.id).filter(id=>id!=='r1');const res=raycaster.intersectObjects(ids.map(id=>PL[id].m.hit),false);if(res.length){const id=ids.find(k=>PL[k].m.hit===res[0].object);if(id)pickTap(id);}}
 else if(sc.mode==='pos'){const pt=new T.Vector3();if(raycaster.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),pt)){const f=toF(pt);posGo(f.x,f.y);}}
}
function onOrient(e){
 if(e.alpha==null||!T)return;gyro.got=true;const k=Math.PI/180;
 const q=new T.Quaternion().setFromEuler(new T.Euler(e.beta*k,e.alpha*k,-e.gamma*k,'YXZ'));
 q.multiply(new T.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2));
 const o=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*k;q.multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(0,0,1),-o));
 const f=new T.Vector3(0,0,-1).applyQuaternion(q);gyro.yaw=Math.atan2(-f.x,-f.z);gyro.pitch=Math.asin(clamp(f.y,-1,1));
}
async function toggleGyro(){
 audio();
 if(gyro.on){gyro.on=false;window.removeEventListener('deviceorientation',onOrient);$('#gyroBtn').classList.remove('act');pill('Bewegen staat uit. Veeg om rond te kijken.');return;}
 try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){pill('Geen toestemming voor bewegen. Veeg om rond te kijken.');return;}}}catch(e){}
 gyro.got=false;window.addEventListener('deviceorientation',onOrient);gyro.on=true;
 setTimeout(()=>{if(gyro.on&&!gyro.got){gyro.on=false;window.removeEventListener('deviceorientation',onOrient);pill('Bewegen werkt op deze pagina niet. Veeg om rond te kijken.');}else if(gyro.on){gyro.off=yaw-gyro.yaw;$('#gyroBtn').classList.add('act');pill('📱 Draai de tablet om rond te kijken');}},1200);
}

$('#sayBtn').onclick=()=>{audio();speak($('#sayText').textContent);};
$('#muteBtn').onclick=()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊';if(muted){try{speechSynthesis.cancel();}catch(e){}}};
$('#gyroBtn').onclick=toggleGyro;
$('#parentBtn').onclick=()=>{renderParent(false);show('parent');};
$('#parentBack').onclick=()=>{renderHome();show('home');};
renderHome();
if(location.search.indexOf('vstest')>=0)window.__vs={CFG,gen,get ST(){return ST},setST:o=>{Object.assign(ST,o);save();renderHome();},gyro,get yaw(){return yaw},state:()=>({mode:cur.sc&&cur.sc.mode,correct:cur.sc&&cur.sc.correct,locked:cur.locked,phase:cur.phase,sw:cur.sw&&cur.sw.phase,cam:camMode,res:!!cur.res}),
 auto(ok){const sc=cur.sc;if(!sc||!cur.res||cur.locked)return false;
  if(sc.mode==='choice')pickChoice(ok?sc.correct:(sc.correct==='pass'?'shoot':'pass'));
  else if(sc.mode==='pos'){const c=PL[sc.ball].f;const s=ok?sc.hint:{x:c.x+(sc.rule==='cover'?80:20),y:c.y+40};posGo(s.x,s.y);}
  else if(sc.mode==='predict')pickTap(ok?sc.correct:sc.covered);
  else if(sc.mode==='scan'){if(cur.phase!=='ask')return false;pickScan(ok?sc.correct:sc.options.find(o=>o!==sc.correct));}
  else if(sc.mode==='sw'){if(cur.sw.phase!=='go')return false;if(sc.correct==='none'){if(ok)return false;pickSwitch('back');}else pickSwitch(ok?sc.correct:(sc.correct==='back'?'forward':'back'));}
  return true;}};
